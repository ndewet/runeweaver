[package]
name = "runeweaver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A compile-time lexer generator with derive macros"
repository.workspace = true
documentation = "https://docs.rs/runeweaver"
readme = "../README.md"
keywords = ["lexer", "parser", "tokenizer", "automata", "proc-macro"]
categories = ["parsing", "development-tools"]
publish = ["crates-io"]

[lib]
name = "runeweaver"

[dependencies]
runeweaver-derive = { version = "=0.2.0", path = "../runeweaver-derive", optional = true }

[features]
default = ["derive", "alloc"]
derive = ["dep:runeweaver-derive", "alloc"]
alloc = []

[lints]
workspace = true
