[package]
name = "runeweaver-logos-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "A Logos-compatible interface backed by Runeweaver"
readme = "README.md"
documentation = "https://docs.rs/runeweaver-logos-shim"
keywords = ["lexer", "logos", "compatibility", "tokenizer"]
categories = ["parsing", "development-tools"]
publish = ["crates-io"]

[lib]
name = "logos"

[dependencies]
runeweaver-logos-shim-derive = { version = "=0.2.0", path = "../runeweaver-logos-shim-derive", optional = true }

[features]
default = ["export_derive", "std"]
export_derive = ["dep:runeweaver-logos-shim-derive"]
std = []
forbid_unsafe = []
debug = []
state_machine_codegen = []

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
