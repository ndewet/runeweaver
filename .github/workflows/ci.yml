name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install minimum supported Rust version
        run: rustup toolchain install 1.86 --profile minimal

      - name: Check minimum supported Rust version
        run: cargo +1.86 check --workspace --all-targets

      - name: Check benchmarks with minimum supported Rust version
        run: cargo +1.86 check --manifest-path benchmarks/Cargo.toml --benches --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path benchmarks/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path benchmarks/Cargo.toml --benches --locked -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Logos compatibility
        run: |
          cargo test --manifest-path logos-tests/Cargo.toml --locked
          cargo test --manifest-path logos-tests/Cargo.toml --locked --all-features
          cargo check -p runeweaver-logos-shim --no-default-features
          cargo check -p runeweaver-logos-shim --no-default-features --features export_derive,forbid_unsafe

      - name: Release test
        run: cargo test --workspace --release

      - name: Benchmark gate tests
        run: node --test .github/scripts/*benchmarks.test.mjs

  benchmark:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: 1
      CARGO_PROFILE_BENCH_LTO: thin
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find benchmark changes
        id: benchmark-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          manifests=(benchmarks/Cargo.toml)
          benchmark_inputs=()
          declare -A inspected

          for ((index = 0; index < ${#manifests[@]}; index++)); do
            manifest="$(realpath "${manifests[index]}")"
            if [[ -n "${inspected[$manifest]:-}" ]]; then
              continue
            fi
            inspected[$manifest]=true

            metadata="$(
              cargo metadata \
                --manifest-path "$manifest" \
                --format-version 1 \
                --no-deps \
                --offline
            )"

            mapfile -t packages < <(
              jq --raw-output '.packages[].manifest_path' <<< "$metadata"
            )
            for package in "${packages[@]}"; do
              benchmark_inputs+=("$(dirname "$package")")
              benchmark_inputs+=("$(
                cargo locate-project \
                  --workspace \
                  --manifest-path "$package" \
                  --message-format plain
              )")
            done

            mapfile -t dependencies < <(
              jq --raw-output \
                '.packages[].dependencies[] | select(.path != null) | .path' \
                <<< "$metadata"
            )
            for dependency in "${dependencies[@]}"; do
              manifests+=("$dependency/Cargo.toml")
            done
          done

          if git diff --quiet "$BASE_SHA" HEAD -- "${benchmark_inputs[@]}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if (( status > 1 )); then
              exit "$status"
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set target directories
        if: steps.benchmark-changes.outputs.run == 'true'
        run: |
          echo "BASE_TARGET=$RUNNER_TEMP/runeweaver-benchmark-base" >> "$GITHUB_ENV"
          echo "PR_TARGET=$RUNNER_TEMP/runeweaver-benchmark-pr" >> "$GITHUB_ENV"

      - name: Check out the base revision
        if: steps.benchmark-changes.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-source

      - name: Build the base benchmarks
        if: steps.benchmark-changes.outputs.run == 'true'
        run: |
          set -o pipefail
          cargo bench \
            --manifest-path .benchmark-source/benchmarks/Cargo.toml \
            --no-run \
            --locked \
            --message-format json |
            jq --raw-output \
              'select(.reason == "compiler-artifact" and (.target.kind | index("bench")) and .executable != null) | [.target.name, .executable] | @tsv' \
              > "$RUNNER_TEMP/base-benchmarks.tsv"
        env:
          CARGO_TARGET_DIR: ${{ env.BASE_TARGET }}
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}/.benchmark-source=/workspace

      - name: Check out the pull request benchmark revision
        if: steps.benchmark-changes.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .benchmark-source

      - name: Build the pull request benchmarks
        if: steps.benchmark-changes.outputs.run == 'true'
        run: |
          set -o pipefail
          cargo bench \
            --manifest-path .benchmark-source/benchmarks/Cargo.toml \
            --no-run \
            --locked \
            --message-format json |
            jq --raw-output \
              'select(.reason == "compiler-artifact" and (.target.kind | index("bench")) and .executable != null) | [.target.name, .executable] | @tsv' \
              > "$RUNNER_TEMP/pr-benchmarks.tsv"
        env:
          CARGO_TARGET_DIR: ${{ env.PR_TARGET }}
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}/.benchmark-source=/workspace

      - name: Find affected benchmark cases
        if: steps.benchmark-changes.outputs.run == 'true'
        id: affected-benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/normalized-benchmarks"
          affected="$RUNNER_TEMP/affected-benchmarks"
          : > "$affected"

          while IFS=$'\t' read -r name base_executable; do
            pr_executable="$(
              awk -F '\t' -v name="$name" '$1 == name { print $2 }' \
                "$RUNNER_TEMP/pr-benchmarks.tsv"
            )"

            if [[ -z "$pr_executable" ]]; then
              echo "$name" >> "$affected"
              continue
            fi

            base_normalized="$RUNNER_TEMP/normalized-benchmarks/base-$name"
            pr_normalized="$RUNNER_TEMP/normalized-benchmarks/pr-$name"
            objcopy \
              --strip-all \
              --remove-section=.comment \
              --remove-section=.note.gnu.build-id \
              "$base_executable" \
              "$base_normalized"
            objcopy \
              --strip-all \
              --remove-section=.comment \
              --remove-section=.note.gnu.build-id \
              "$pr_executable" \
              "$pr_normalized"

            if ! cmp --silent "$base_normalized" "$pr_normalized"; then
              echo "$name" >> "$affected"
            fi
          done < "$RUNNER_TEMP/base-benchmarks.tsv"

          if [[ -s "$affected" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Affected benchmark cases: $(paste -sd, "$affected")"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No benchmark executable changed."
          fi

      - name: Measure paired revisions
        if: steps.affected-benchmarks.outputs.run == 'true'
        run: |
          cpu="$(awk '/Cpus_allowed_list/ { split($2, cpus, /[-,]/); print cpus[1] }' /proc/self/status)"
          taskset --cpu-list "$cpu" node .github/scripts/run_benchmarks.mjs \
            "$RUNNER_TEMP/base-benchmarks.tsv" \
            "$RUNNER_TEMP/pr-benchmarks.tsv" \
            "$RUNNER_TEMP/affected-benchmarks" \
            "$RUNNER_TEMP/paired-benchmarks"

      - name: Check for regressions
        if: steps.affected-benchmarks.outputs.run == 'true'
        id: benchmark-results
        run: node .github/scripts/check_benchmarks.mjs "$RUNNER_TEMP/paired-benchmarks/results.json" --paired --threshold 0.05
        env:
          BENCHMARK_REPORT: ${{ runner.temp }}/benchmark-report.md

      - name: Comment benchmark changes
        if: always() && steps.benchmark-results.outputs.completed == 'true'
        uses: actions/github-script@v9
        env:
          BENCHMARK_REPORT: ${{ runner.temp }}/benchmark-report.md
          HAS_CHANGES: ${{ steps.benchmark-results.outputs.has_changes }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- runeweaver-benchmark-report -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (process.env.HAS_CHANGES !== "true") {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: `${marker}\nNo benchmark improvements or regressions were found.`,
                });
              }
              return;
            }

            const body = `${marker}\n${fs.readFileSync(process.env.BENCHMARK_REPORT, "utf8")}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
